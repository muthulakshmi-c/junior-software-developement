<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>outline</title>
</head>
<style>
    h1{
        border: 1px thick pink;
border-top-right-radius: 20px;

    h1:hover{
        cursor: alias;
    }
    body{
        background: linear-gradient(yellow, blue);
    }

</style>

    <h1>my name is muthu</h1>
    
</body>
</html>
